<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gh-writer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf8f4;
        --fg: #1f1d1a;
        --muted: #6b665e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1d1a;
          --fg: #faf8f4;
          --muted: #a8a299;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, sans-serif;
      }
      p {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <p role="status">Opening gh-writer…</p>
    </main>
  </body>
</html>
