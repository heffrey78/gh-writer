name: Set up novel

# Runs once in a repository created from the template: gives the novel fresh
# IDs and a title based on the repository name. Later runs do nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Replace template IDs and set the title
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: node .github/gh-writer/init.mjs "$REPO_NAME"
      - name: Draw the diagrams
        run: node .github/gh-writer/snapshots.mjs
      - name: Commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Already set up."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Set up novel: fresh IDs and title"
          git push
